name: Build and Release

on:
  push:
    branches:
      - electron 
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g., 1.0.0)"
        required: false
        type: string

# 抽取重复步骤为复用模板，减少冗余
defaults:
  run:
    shell: bash  # 统一shell，避免跨平台兼容问题
jobs:
  # 构建通用步骤模板（复用）
  build-base:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false  # 一个平台构建失败不影响其他平台
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        include:
          - os: windows-latest
            dist-script: npm run dist:win
            artifacts: |
              dist/*.exe
              dist/*.zip
            artifact-name: windows-builds
          - os: macos-latest
            dist-script: npm run dist:mac
            artifacts: |
              dist/*.dmg
              dist/*.zip
            artifact-name: macos-builds
          - os: ubuntu-latest
            dist-script: npm run dist:linux
            artifacts: |
              dist/*.AppImage
              dist/*.deb
            artifact-name: linux-builds

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 拉取完整历史，避免Electron打包时git信息缺失

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json  # 精准缓存npm依赖

      - name: Install dependencies
        run: |
          npm clean-install  # 更严格的依赖安装，避免版本不一致
          # Linux平台额外安装Electron构建依赖
          if [[ ${{ matrix.os }} == "ubuntu-latest" ]]; then
            sudo apt-get update
            sudo apt-get install -y libgtk-3-dev libnss3-dev libasound2-dev
          fi

      - name: Build application
        run: npm run build

      - name: Build platform installer
        run: ${{ matrix.dist-script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifacts }}
          retention-days: 30

  release:
    needs: build-base  # 依赖重构后的build-base job
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write  # 授予创建Release的权限
      packages: read   # 额外授予读取权限，避免权限不足

    steps:
      - name: Create dist directory
        run: mkdir -p dist  # 确保dist目录存在

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-builds
          path: dist/windows  # 分目录存放，避免文件冲突

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-builds
          path: dist/macos

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-builds
          path: dist/linux

      - name: Collect all artifacts to root dist
        run: |
          # 将各平台文件复制到根dist目录，方便Release上传
          cp dist/windows/* dist/ || true
          cp dist/macos/* dist/ || true
          cp dist/linux/* dist/ || true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: CineMaster ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
